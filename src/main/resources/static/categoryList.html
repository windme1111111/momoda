4.2 完成商品查询
依次创建Item、ItemMapper、ItemService、ItemServiceImpl、ItemController
<body>
<div id="app">
    <table align="center" width="500px" border="1">
        <tr>
            <th>编号</th>
            <th>名称</th>
            <th>查看商品</th>
        </tr>
        <tr v-for="category in categories">
            <td>{{category.id}}</td>
            <td>{{category.name}}</td>
            <td><a href="itemList.html">查看商品</a></td>
        </tr>
    </table>
</div>
<script src="js/vue.js"></script>
<script src="js/axios.min.js"></script>
<script>
    let config = {
        el: '#app',
        data: {
            categories: []
        },
        methods: {
            getCategories: function () {
// 发送异步请求获取数据
                axios.get('category/selectAll').then((response) => {
                    console.log(response)
                    if (response.data.code == 200 && response.data.message == 'OK') {
                        console.log(response.data.data)
                        this.categories = response.data.data // 获取数据，并赋
                        //给categories
                        console.log(this.categories)
                    }
                    else {
                        alert(response.data.message)
                    }
                }).catch(function(error) {
                    console.log(error)
                })
            }
        },
        created: function () {
            this.getCategories() // 调用方法 执行异步请求
        }
    }
    let vue = new Vue(config)
</script>
</body>
</html>
