<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>修改商品</h1>
<div id="app">
    <form action="item/update" method="post" enctype="multipart/form-data">
        <!-- 隐藏表单域 -->
        <input type="hidden" name="id" :value="item.id">
        <input type="text" name="name" placeholder="商品名称" :value="item.name">
        </input><br><br>
        <input type="text" name="price" placeholder="商品价格" :value="item.price">
        </input><br><br>
        <input type="text" name="description" placeholder="商品描述"
               :value="item.description"></input><br><br>
        <input type="file" name="file"></input><br><br>
        <select name="categoryId">
            <option value="">请选择商品分类</option>
            <option v-for="category in categories" :value="category.id">
                {{category.name}}</option>
        </select><br><br>
        <input type="submit" value="修改"></input>
    </form>
</div>
<script src="js/vue.js"></script>
<script src="js/axios.min.js"></script>
<script>
    let config = {
        el: '#app',
        data: {
            categories: [],
            item: {
                id: '',
                name: '',
                price: '',
                description: '',
                image: '',
                categoryId: ''
            }
        },
        methods: {
            getCategories: function () {
// 获取所有分类
                axios.get('category/selectAll').then((response) => {
                    console.log(response)
                    if (response.data.code == 200 && response.data.message == 'OK') {
                        console.log(response.data.data)
                        this.categories = response.data.data // 获取数据，并赋给categories
                    }
                })
            },
            getItem: async function() {
                try {
                    // 更安全可靠的URL参数获取方式
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id');

                    // 验证ID是否存在且有效
                    if (!id || isNaN(id)) {
                        console.error('无效的商品ID:', id);
                        this.error = '请提供有效的商品ID';
                        return;
                    }

                    // 更安全的请求方式，使用params对象
                    const response = await axios.get('item/selectById', {
                        params: { id }
                    });

                    // 验证响应数据
                    if (!response.data || !response.data.data) {
                        throw new Error('无效的响应格式');
                    }

                    const item = response.data.data;

                    // 使用对象展开运算符更新数据，保留未修改字段
                    this.item = {
                        ...this.item,
                        id: item.id || '',
                        name: item.name || '',
                        price: item.price || '',
                        description: item.description || '',
                        // 保留原有的image和categoryId值，除非响应中有新值
                        image: item.image || this.item.image,
                        categoryId: item.categoryId || this.item.categoryId
                    };

                } catch (error) {
                    console.error('获取商品详情失败:', error);
                    this.error = '获取商品信息时出错，请稍后重试';

                    // 可以根据不同的错误类型显示不同的提示
                    if (error.response) {
                        // 请求已发出，服务器返回了非2xx状态码
                        if (error.response.status === 404) {
                            this.error = '未找到该商品';
                        } else if (error.response.status === 400) {
                            this.error = '请求参数有误';
                        }
                    } else if (error.request) {
                        // 请求已发出，但没有收到响应
                        this.error = '网络连接出现问题，请检查网络';
                    }
                }
            }

        },
        created: function () {
            this.getCategories() // 调用方法 执行异步请求
            this.getItem()
        }
    }
    let vue = new Vue(config)
</script>
</body>
</html>
