<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>添加商品</h1>
<form action="item/insert" method="post" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="商品名称"></input>
    <input type="text" name="price" placeholder="商品价格"></input>
    <input type="text" name="description" placeholder="商品描述"></input>
    <input type="file" name="file"></input>
    <select name="categoryId" id="app">
        <option value="">请选择商品分类</option>
        <option v-for="category in categories" :value="category.id">
            {{category.name}}</option>
    </select>
    <input type="submit" value="添加"></input>
</form>
<script src="js/vue.js"></script>
<script src="js/axios.min.js"></script>
<script>
    let config = {
        el: '#app',
        data: {
            categories: []
        },
        methods: {
            getCategories: function () {
// 获取所有分类
                axios.get('category/selectAll').then((response) => {
                    console.log(response)
                    if (response.data.code == 200 && response.data.message == 'OK') {
                        console.log(response.data.data)
                        this.categories = response.data.data // 获取数据，并赋给categories
                    }
                })
            }
        },
        created: function () {
            this.getCategories() // 调用方法 执行异步请求
        }
    }
    let vue = new Vue(config)
</script>
</body>
</html>
